<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پنل مدیریت پروژه شایگان | مدیریت پروژه‌ها، مالی و زیرساخت</title>
    <meta name="description" content="پنل حرفه‌ای و جامع مدیریت پروژه‌ها، مطالبات مالی، کارفرمایان و زیرساخت سرور و دامنه با پشتیبانی کامل از تقویم شمسی و فونت وزیرمتن." />
    <meta property="og:title" content="پنل مدیریت پروژه شایگان" />
    <meta property="og:description" content="سیستم جامع مدیریت پروژه، سود خالص و زیرساخت‌های سرور و دامنه" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
      *, *::before, *::after, svg text, tspan, input, select, textarea, button {
        font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      }
      body {
        font-family: 'Vazirmatn', sans-serif !important;
        background-color: #f8fafc;
        font-feature-settings: "ss01" 1, "tnum" 1;
        -webkit-font-feature-settings: "ss01" 1, "tnum" 1;
        font-variant-numeric: tabular-nums;
      }
      .font-mono {
        font-family: 'Vazirmatn', monospace !important;
        font-variant-numeric: tabular-nums;
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
      /* Custom scrollbar for a clean look */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* DatePicker Customization to match theme */
      .rmdp-container { width: 100% !important; }
      .rmdp-input {
        width: 100% !important;
        padding: 0.625rem 1rem !important;
        background-color: #f8fafc !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 0.75rem !important;
        font-family: 'Vazirmatn', sans-serif !important;
        font-size: 0.75rem !important;
        font-weight: 700 !important;
        outline: none !important;
        height: 40px !important;
      }
      .rmdp-input:focus {
        border-color: #4f46e5 !important;
        box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.12) !important;
      }
      .rmdp-calendar, .rmdp-wrapper {
        font-family: 'Vazirmatn', sans-serif !important;
        border-radius: 1rem !important;
        overflow: hidden !important;
      }
      .recharts-text, .recharts-cartesian-axis-tick-value, .recharts-tooltip-wrapper {
        font-family: 'Vazirmatn', sans-serif !important;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
